                  type Shared = (Retained<AnyObject>, Rc<RefCell<String>>);
                  thread_local! {
                      static FIELD: RefCell<Option<Shared>> = const { RefCell::new(None) };
                  }
                  unsafe {
                      let existing = FIELD.with(|f| f.borrow().clone());
                      let (field, last) = match existing {
                          Some(pair) => pair,
                          None if !allowed => {
                              let _: bool = msg_send![&*self.view, endEditing: true];
                              let _: bool = msg_send![&*self.view, resignFirstResponder];
                              return;
                          }
