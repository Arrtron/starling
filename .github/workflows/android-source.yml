               '            #[cfg(target_os = "ios")]\n            {\n                self.captured = capture;\n            }\n            #[cfg(not(target_os = "macos"))]\n            if self.captured && self.focused {', 1),
              ('        self.flush_ime(&mut hud);\n', '        #[cfg(target_os = "ios")]\n        ios_touch::draw(&mut hud, &self.gui.atlas);\n        self.flush_ime(&mut hud);\n', 1),
              # No crosshair on a touch screen: the block under the finger is the target.
              ('        #[cfg(not(target_os = "android"))]\n        {\n            true\n        }\n    }\n    fn interaction_direction',
               '        #[cfg(target_os = "ios")]\n        {\n            false\n        }\n        #[cfg(not(any(target_os = "android", target_os = "ios")))]\n        {\n            true\n        }\n    }\n    fn interaction_direction', 1),
              ('        forward\n    }\n    /// Voxel traversal against non-air',
               '        #[cfg(target_os = "ios")]\n        if let Some(point) = ios_touch::aim() {\n            let fov = self.locator_camera.map_or(70.0, |c| c.3);\n            let size = self.window.as_ref().map(|w| w.inner_size());\n            let aspect = size.map_or(16.0 / 9.0, |s| s.width as f64 / s.height.max(1) as f64);\n            return horizon_client::touch::screen_direction(\n                forward,\n                view_vector(self.yaw, self.pitch - 90.0),\n                point,\n                aspect,\n                fov as f64,\n            );\n        }\n        forward\n    }\n    /// Voxel traversal against non-air', 1),
              ('            #[cfg(not(target_os = "android"))]\n            {\n                true\n            }\n        };\n        // GameRenderer.shouldRenderBlockOutline',
               '            #[cfg(target_os = "ios")]\n            {\n                ios_touch::aim().is_some()\n            }\n            #[cfg(not(any(target_os = "android", target_os = "ios")))]\n            {\n                true\n            }\n        };\n        // GameRenderer.shouldRenderBlockOutline', 1),
          ])
          AI = 'cfg!(any(target_os = "android", target_os = "ios"))'
          sub('crates/horizon-client/src/game/pad.rs', [
              ('        if !settings.enabled && !cfg!(target_os = "android") {', '        if !settings.enabled && !' + AI + ' {', 1),
              ('(!settings.enabled && !cfg!(target_os = "android"))', '(!settings.enabled && !' + AI + ')', 2),
              ('            None => self.pad.read(),\n',
               '            None => {\n                #[cfg(target_os = "ios")]\n                {\n                    self.ios_pad_state()\n                }\n                #[cfg(not(target_os = "ios"))]\n                {\n                    self.pad.read()\n                }\n            }\n', 1),
              ('    pub(super) fn pad_look(&mut self, seconds: f32) {\n',
               '    pub(super) fn pad_look(&mut self, seconds: f32) {\n        #[cfg(target_os = "ios")]\n        {\n            let [dx, dy] = super::ios_touch::take_look();\n            if (dx != 0.0 || dy != 0.0) && !self.pad_in_menu() && self.player.is_some() {\n                let (yaw, pitch) = (f64::from(dx) * 1.2, f64::from(dy) * 1.2);\n                self.tutorial.mouse(yaw * 0.15, pitch * 0.15);\n                self.turn_player(yaw, pitch);\n            }\n        }\n', 1),
              # The on-screen Sprint button must always land (as on Android), screen or not.
              ('            #[cfg(target_os = "android")]\n            "key.sprint" => {',
