               '        let dev = self.mods.dev.len();\n        if dev > 0 {\n            log::warn!(\"Horizon: {dev} dev mod(s) not started: this build has no mod runtime\");\n        }\n        // Content mods (.hmod) load in every build: list them on the Mods page so they can be turned on.\n        self.settings.mods.installed = horizon_mods::find(&dir)\n            .iter()\n            .map(|path| {\n                let file = path.file_name().unwrap_or_default().to_string_lossy().into_owned();\n                match horizon_mods::Package::read(path) {\n                    Ok(package) => {\n                        let m = package.manifest;\n                        let may: Vec<&str> = m.capabilities.iter().map(|c| c.describe()).collect();\n                        let may = if may.is_empty() {\n                            \"Asks for nothing.\".to_owned()\n                        } else {\n                            format!(\"May {}.\", may.join(\", \"))\n                        };\n                        mod_list::Installed {\n                            id: m.id.clone(),\n                            title: format!(\"{} {}\", m.name, m.version),\n                            description: format!(\"{may} {}\", m.description).trim().to_owned(),\n                            problem: None,\n                            dev: false,\n                            has_settings: false,\n                            native: None,\n                        }\n                    }\n                    Err(e) => mod_list::Installed {\n                        id: String::new(),\n                        title: file,\n                        description: String::new(),\n                        problem: Some(format!(\"Stopped: {e}\")),\n                        dev: false,\n                        has_settings: false,\n                        native: None,\n                    },\n                }\n            })\n            .collect();\n        self.list_native_mods();\n', 1),
