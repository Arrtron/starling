                              let frame = CGRect {
                                  origin: CGPoint { x: bounds.size.width * 0.1, y: bounds.size.height * 0.4 },
                                  size: CGSize { width: bounds.size.width * 0.8, height: 40.0 },
                              };
                              let field: Retained<AnyObject> =
                                  msg_send_id![msg_send_id![class!(UITextField), alloc], initWithFrame: frame];
                              let white: Retained<AnyObject> = msg_send_id![class!(UIColor), whiteColor];
                              let _: () = msg_send![&*field, setBackgroundColor: &*white];
                              // Dark mode would make the text white on white: force black text, light look.
                              let black: Retained<AnyObject> = msg_send_id![class!(UIColor), blackColor];
                              let _: () = msg_send![&*field, setTextColor: &*black];
                              let _: () = msg_send![&*field, setTintColor: &*black];
                              let _: () = msg_send![&*field, setOverrideUserInterfaceStyle: 1isize];
                              let _: () = msg_send![&*field, setBorderStyle: 3isize];
                              let _: () = msg_send![&*field, setAutocapitalizationType: 0isize];
                              let _: () = msg_send![&*field, setAutocorrectionType: 1isize];
                              let _: () = msg_send![&*field, setReturnKeyType: 7isize];
                              let last = Rc::new(RefCell::new(String::new()));

                              let changed = {
                                  let (field, last, view) = (field.clone(), last.clone(), self.view.clone());
                                  RcBlock::new(move |_action: *mut AnyObject| {
                                      let text: Option<Retained<NSString>> = msg_send_id![&*field, text];
                                      let now = text.map(|t| t.to_string()).unwrap_or_default();
                                      let prev = last.borrow().clone();
                                      let common = prev.chars().zip(now.chars()).take_while(|(a, b)| a == b).count();
                                      for _ in 0..prev.chars().count() - common {
                                          let _: () = msg_send![&*view, deleteBackward];
                                      }
                                      let added: String = now.chars().skip(common).collect();
                                      if !added.is_empty() {
                                          let ns = NSString::from_str(&added);
                                          let _: () = msg_send![&*view, insertText: &*ns];
                                      }
                                      *last.borrow_mut() = now;
                                  })
                              };
                              let action: Retained<AnyObject> =
                                  msg_send_id![class!(UIAction), actionWithHandler: &*changed];
                              // UIControlEventEditingChanged
                              let _: () = msg_send![&*field, addAction: &*action, forControlEvents: 1usize << 17];

                              let submit = {
                                  let view = self.view.clone();
                                  RcBlock::new(move |_action: *mut AnyObject| {
                                      let ns = NSString::from_str("\n");
                                      let _: () = msg_send![&*view, insertText: &*ns];
                                  })
                              };
                              let action: Retained<AnyObject> =
                                  msg_send_id![class!(UIAction), actionWithHandler: &*submit];
                              // UIControlEventEditingDidEndOnExit
                              let _: () = msg_send![&*field, addAction: &*action, forControlEvents: 1usize << 19];

                              let _: () = msg_send![&*self.view, addSubview: &*field];

                              // The field rides on top of the keyboard: follow the keyboard's frame.
                              let follow = {
                                  let (field, view) = (field.clone(), self.view.clone());
                                  RcBlock::new(move |note: *mut AnyObject| {
                                      let info: Option<Retained<AnyObject>> = msg_send_id![&*note, userInfo];
                                      let Some(info) = info else { return };
                                      let key = NSString::from_str("UIKeyboardFrameEndUserInfoKey");
                                      let value: Option<Retained<AnyObject>> = msg_send_id![&*info, objectForKey: &*key];
                                      let Some(value) = value else { return };
                                      let end: CGRect = msg_send![&*value, CGRectValue];
                                      let rect: CGRect = msg_send![
                                          &*view,
                                          convertRect: end,
                                          fromView: std::ptr::null_mut::<AnyObject>()
                                      ];
                                      let bounds: CGRect = msg_send![&*view, bounds];
                                      if rect.origin.y >= bounds.size.height {
                                          return;
                                      }
                                      let frame = CGRect {
                                          origin: CGPoint { x: bounds.size.width * 0.1, y: (rect.origin.y - 44.0).max(0.0) },
                                          size: CGSize { width: bounds.size.width * 0.8, height: 40.0 },
                                      };
                                      let _: () = msg_send![&*field, setFrame: frame];
                                  })
                              };
                              let center: Retained<AnyObject> = msg_send_id![class!(NSNotificationCenter), defaultCenter];
                              let name = NSString::from_str("UIKeyboardWillChangeFrameNotification");
                              let _: Retained<AnyObject> = msg_send_id![
                                  &*center,
                                  addObserverForName: &*name,
                                  object: std::ptr::null_mut::<AnyObject>(),
                                  queue: std::ptr::null_mut::<AnyObject>(),
                                  usingBlock: &*follow
                              ];
                              FIELD.with(|f| *f.borrow_mut() = Some((field.clone(), last.clone())));
                              (field, last)
                          }
                      };
                      if allowed {
                          last.borrow_mut().clear();
                          let empty = NSString::from_str("");
                          let _: () = msg_send![&*field, setText: &*empty];
                          let _: () = msg_send![&*field, setHidden: false];
                          let _: bool = msg_send![&*field, becomeFirstResponder];
                      } else {
                          let _: bool = msg_send![&*field, resignFirstResponder];
                          // Close the keyboard whoever holds it.
                          let _: bool = msg_send![&*self.view, endEditing: true];
                          let _: bool = msg_send![&*self.view, resignFirstResponder];
                          let _: () = msg_send![&*field, setHidden: true];
                      }
                  }
              }
          '''
