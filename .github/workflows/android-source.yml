name: iOS build IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '3'
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@v4
      - name: Apply iOS edits
        run: |
          python3 - <<'PY_EOF'
          def sub(p, pairs):
              s = open(p).read()
              for o, n, c in pairs:
                  assert s.count(o) == c, (p, o, s.count(o))
                  s = s.replace(o, n)
              open(p, 'w').write(s)

          NA = 'cfg(not(target_os = "android"))'
          NAI = 'cfg(not(any(target_os = "android", target_os = "ios")))'
          NM = 'cfg(not(target_os = "macos"))'
          NMI = 'cfg(not(any(target_os = "macos", target_os = "ios")))'

          # arboard (Linux clipboard) is not for iOS: the game's own clipboard only.
          for p in ['crates/horizon-client-input/Cargo.toml', 'crates/horizon-client/Cargo.toml']:
              sub(p, [("[target.'" + NA + "'.dependencies]\narboard", "[target.'" + NAI + "'.dependencies]\narboard", 1)])
          sub('crates/horizon-client-input/src/clipboard.rs', [
              ('#[' + NA + ']', '#[' + NAI + ']', 4),
              ('        #[cfg(target_os = "android")]\n        return clipboard_get().unwrap_or_else(|| self.copied.clone().unwrap_or_default());\n',
               '        #[cfg(target_os = "android")]\n        return clipboard_get().unwrap_or_else(|| self.copied.clone().unwrap_or_default());\n        #[cfg(target_os = "ios")]\n        return self.copied.clone().unwrap_or_default();\n', 1),
          ])
          # Keyboard layout learning: not on iOS (same as Android).
          sub('crates/horizon-client-input/src/keybinds.rs', [
              ('#[' + NA + ']\npub fn learn_layout', '#[' + NAI + ']\npub fn learn_layout', 1),
              ('#[cfg(target_os = "android")]\npub fn learn_layout', '#[cfg(any(target_os = "android", target_os = "ios"))]\npub fn learn_layout', 1),
          ])
          # No Vulkan on iOS (Metal only), as on macOS.
          sub('crates/horizon-hdr/Cargo.toml', [(NM, NMI, 1)])
          sub('crates/horizon-hdr/src/lib.rs', [
              ('#[' + NM + ']', '#[' + NMI + ']', 2),
              ('#[cfg(target_os = "macos")]', '#[cfg(any(target_os = "macos", target_os = "ios"))]', 1),
          ])
          sub('crates/horizon-client-render/src/gfx.rs', [
              ('    #[' + NM + ']\n    let opened', '    #[' + NMI + ']\n    let opened', 1),
              ('    #[cfg(target_os = "macos")]\n    let opened = None;', '    #[cfg(any(target_os = "macos", target_os = "ios"))]\n    let opened = None;', 1),
              ('#[cfg(target_os = "macos")]\nconst NO_GPU_DRIVER', '#[cfg(any(target_os = "macos", target_os = "ios"))]\nconst NO_GPU_DRIVER', 1),
              ('#[cfg(not(any(target_os = "windows", target_os = "macos")))]\nconst NO_GPU_DRIVER', '#[cfg(not(any(target_os = "windows", target_os = "macos", target_os = "ios")))]\nconst NO_GPU_DRIVER', 1),
          ])
          sub('crates/horizon-client-render/src/logging.rs', [
              ('    } else if cfg!(target_os = "macos") {\n        if let Some(h) = &home {\n            return h.join("Library/Application Support");',
               '    } else if cfg!(target_os = "ios") {\n        if let Some(h) = &home {\n            return h.join("Documents");\n        }\n    } else if cfg!(target_os = "macos") {\n        if let Some(h) = &home {\n            return h.join("Library/Application Support");', 1),
          ])
          # Metal on iOS (as on macOS): no Vulkan/OpenGL fallback list.
          sub('crates/horizon-client-render/src/gfx.rs', [
              ('    if os == "macos" || wgpu_backend {', '    if os == "macos" || os == "ios" || wgpu_backend {', 1),
          ])
          # First launch on iOS: install the game files (the Android installer) while a window keeps the app alive.
          IOS_FN = r'''/// iOS: the game lives in Documents/horizon. When its files are not installed yet, download them
          /// (official Mojang endpoints, as the Android build does) on a thread while a progress screen
          /// shows the step; the next launch starts the game.
          #[cfg(target_os = "ios")]
          fn ios_prepare(home: &std::path::Path) -> bool {
              use std::rc::Rc;
              use std::sync::atomic::{AtomicU64, Ordering};
              // 0: installing, 1: finished, 2: failed.
              static STATE: AtomicU64 = AtomicU64::new(0);
              static DONE: AtomicU64 = AtomicU64::new(0);
              static TOTAL: AtomicU64 = AtomicU64::new(0);
              static LABEL: std::sync::Mutex<String> = std::sync::Mutex::new(String::new());

              let _ = std::fs::create_dir_all(home);
              // Old logs are packed to *.log.gz at start: delete them, keep only latest.log.
              if let Ok(entries) = std::fs::read_dir(home.join("logs")) {
                  for entry in entries.flatten() {
                      let path = entry.path();
                      if path.extension().is_some_and(|x| x == "gz") {
                          let _ = std::fs::remove_file(path);
                      }
                  }
              }
              if let Err(e) = std::env::set_current_dir(home) {
                  log::error!("Horizon iOS: cannot enter {}: {e}", home.display());
              }
              if horizon_client::official_install::ready(home) {
                  log::info!("Horizon iOS: game files are installed");
                  return true;
              }
              log::info!("Horizon iOS: installing the game files into {}", home.display());
              let home = home.to_path_buf();
              // The generated engine tables ship inside the app (as in the Android APK).
              let bundled = std::env::current_exe().ok().and_then(|e| Some(e.parent()?.join("engine-data.zip")));
              match bundled {
                  Some(src) if src.is_file() => {
                      if let Err(e) = std::fs::copy(&src, home.join("engine-data.zip")) {
                          log::error!("Horizon iOS: cannot copy the engine tables: {e}");
                      }
                  }
                  _ => log::error!("Horizon iOS: engine-data.zip is missing from the app"),
              }
              std::thread::spawn(move || {
                  let last = AtomicU64::new(u64::MAX);
                  let result = horizon_client::official_install::install_with_progress(&home, |p| {
                      DONE.store(p.done, Ordering::Relaxed);
                      TOTAL.store(p.total, Ordering::Relaxed);
                      if let Ok(mut label) = LABEL.lock() {
                          *label = p.stage.label().to_string();
                      }
                      let bucket = (p.stage as u64) * 1000 + if p.total > 0 { p.done * 20 / p.total } else { 0 };
                      if last.swap(bucket, Ordering::Relaxed) != bucket {
                          log::info!("Horizon iOS install: {} ({}/{})", p.stage.label(), p.done, p.total);
                          logging::flush();
                      }
                  });
                  match result {
                      Ok(()) => {
                          log::info!("Horizon iOS: install finished; open the app again to play");
                          STATE.store(1, Ordering::Relaxed);
                      }
                      Err(e) => {
                          log::error!("Horizon iOS: install failed: {e}");
                          STATE.store(2, Ordering::Relaxed);
                      }
                  }
                  logging::flush();
              });

              /// A 5x7 pixel font for the install screen (upper case, digits and a few signs).
              fn glyph(c: char) -> [u8; 7] {
                  match c.to_ascii_uppercase() {
                      'A' => [0b01110, 0b10001, 0b10001, 0b11111, 0b10001, 0b10001, 0b10001],
                      'B' => [0b11110, 0b10001, 0b10001, 0b11110, 0b10001, 0b10001, 0b11110],
                      'C' => [0b01110, 0b10001, 0b10000, 0b10000, 0b10000, 0b10001, 0b01110],
                      'D' => [0b11110, 0b10001, 0b10001, 0b10001, 0b10001, 0b10001, 0b11110],
                      'E' => [0b11111, 0b10000, 0b10000, 0b11110, 0b10000, 0b10000, 0b11111],
                      'F' => [0b11111, 0b10000, 0b10000, 0b11110, 0b10000, 0b10000, 0b10000],
                      'G' => [0b01110, 0b10001, 0b10000, 0b10111, 0b10001, 0b10001, 0b01111],
                      'H' => [0b10001, 0b10001, 0b10001, 0b11111, 0b10001, 0b10001, 0b10001],
                      'I' => [0b01110, 0b00100, 0b00100, 0b00100, 0b00100, 0b00100, 0b01110],
                      'J' => [0b00111, 0b00010, 0b00010, 0b00010, 0b00010, 0b10010, 0b01100],
                      'K' => [0b10001, 0b10010, 0b10100, 0b11000, 0b10100, 0b10010, 0b10001],
                      'L' => [0b10000, 0b10000, 0b10000, 0b10000, 0b10000, 0b10000, 0b11111],
                      'M' => [0b10001, 0b11011, 0b10101, 0b10101, 0b10001, 0b10001, 0b10001],
                      'N' => [0b10001, 0b11001, 0b10101, 0b10011, 0b10001, 0b10001, 0b10001],
                      'O' => [0b01110, 0b10001, 0b10001, 0b10001, 0b10001, 0b10001, 0b01110],
                      'P' => [0b11110, 0b10001, 0b10001, 0b11110, 0b10000, 0b10000, 0b10000],
                      'Q' => [0b01110, 0b10001, 0b10001, 0b10001, 0b10101, 0b10010, 0b01101],
                      'R' => [0b11110, 0b10001, 0b10001, 0b11110, 0b10100, 0b10010, 0b10001],
                      'S' => [0b01111, 0b10000, 0b10000, 0b01110, 0b00001, 0b00001, 0b11110],
                      'T' => [0b11111, 0b00100, 0b00100, 0b00100, 0b00100, 0b00100, 0b00100],
                      'U' => [0b10001, 0b10001, 0b10001, 0b10001, 0b10001, 0b10001, 0b01110],
                      'V' => [0b10001, 0b10001, 0b10001, 0b10001, 0b10001, 0b01010, 0b00100],
                      'W' => [0b10001, 0b10001, 0b10001, 0b10101, 0b10101, 0b11011, 0b10001],
                      'X' => [0b10001, 0b10001, 0b01010, 0b00100, 0b01010, 0b10001, 0b10001],
                      'Y' => [0b10001, 0b10001, 0b01010, 0b00100, 0b00100, 0b00100, 0b00100],
                      'Z' => [0b11111, 0b00001, 0b00010, 0b00100, 0b01000, 0b10000, 0b11111],
                      '0' => [0b01110, 0b10001, 0b10011, 0b10101, 0b11001, 0b10001, 0b01110],
                      '1' => [0b00100, 0b01100, 0b00100, 0b00100, 0b00100, 0b00100, 0b01110],
                      '2' => [0b01110, 0b10001, 0b00001, 0b00010, 0b00100, 0b01000, 0b11111],
                      '3' => [0b11110, 0b00001, 0b00001, 0b01110, 0b00001, 0b00001, 0b11110],
                      '4' => [0b00010, 0b00110, 0b01010, 0b10010, 0b11111, 0b00010, 0b00010],
                      '5' => [0b11111, 0b10000, 0b11110, 0b00001, 0b00001, 0b10001, 0b01110],
                      '6' => [0b00110, 0b01000, 0b10000, 0b11110, 0b10001, 0b10001, 0b01110],
                      '7' => [0b11111, 0b00001, 0b00010, 0b00100, 0b01000, 0b01000, 0b01000],
                      '8' => [0b01110, 0b10001, 0b10001, 0b01110, 0b10001, 0b10001, 0b01110],
                      '9' => [0b01110, 0b10001, 0b10001, 0b01111, 0b00001, 0b00010, 0b01100],
                      '%' => [0b11000, 0b11001, 0b00010, 0b00100, 0b01000, 0b10011, 0b00011],
                      '.' => [0, 0, 0, 0, 0, 0b01100, 0b01100],
                      '-' => [0, 0, 0, 0b11111, 0, 0, 0],
                      _ => [0; 7],
                  }
              }

              fn fill_rect(buf: &mut [u32], w: usize, h: usize, x: usize, y: usize, rw: usize, rh: usize, color: u32) {
                  for yy in y..(y + rh).min(h) {
                      for xx in x..(x + rw).min(w) {
                          buf[yy * w + xx] = color;
                      }
                  }
              }

              fn text_width(s: &str, scale: usize) -> usize {
                  s.chars().count() * 6 * scale
              }

              /// Text centred on the width of the screen, top at `y`.
              fn draw_text(buf: &mut [u32], w: usize, h: usize, s: &str, y: usize, scale: usize, color: u32) {
                  let mut x = w.saturating_sub(text_width(s, scale)) / 2;
                  for c in s.chars() {
                      let rows = glyph(c);
                      for (row, bits) in rows.iter().enumerate() {
                          for col in 0..5 {
                              if bits & (1 << (4 - col)) != 0 {
                                  fill_rect(buf, w, h, x + col * scale, y + row * scale, scale, scale, color);
                              }
                          }
                      }
                      x += 6 * scale;
                  }
              }

              /// The first-launch install screen: title, current step, a bar and the percent.
              fn draw_install_screen(buf: &mut [u32], w: usize, h: usize, label: &str, percent: usize, hint: &str) {
                  buf.fill(0x000d0d0d);
                  let s = (w.min(h * 2) / 260).max(2);
                  draw_text(buf, w, h, "HORIZON", h / 5, s * 2, 0x00ffffff);
                  draw_text(buf, w, h, label, h * 2 / 5, s, 0x00c8c8c8);
                  let bar_w = w * 7 / 10;
                  let bar_h = (s * 3).max(8);
                  let bar_x = (w - bar_w) / 2;
                  let bar_y = h * 3 / 5;
                  fill_rect(buf, w, h, bar_x, bar_y, bar_w, bar_h, 0x00333333);
                  fill_rect(buf, w, h, bar_x, bar_y, bar_w * percent.min(100) / 100, bar_h, 0x0055cc55);
                  draw_text(buf, w, h, &format!("{}%", percent.min(100)), bar_y + bar_h + s * 3, s * 2, 0x00ffffff);
                  draw_text(buf, w, h, hint, h * 4 / 5, s, 0x00808080);
              }

              struct Keep {
                  window: Option<Rc<winit::window::Window>>,
                  context: Option<softbuffer::Context<Rc<winit::window::Window>>>,
                  surface: Option<softbuffer::Surface<Rc<winit::window::Window>, Rc<winit::window::Window>>>,
              }
              impl Keep {
                  fn draw(&mut self) {
                      let (Some(window), Some(surface)) = (&self.window, &mut self.surface) else {
                          return;
                      };
                      let size = window.inner_size();
                      let (Some(w), Some(h)) =
                          (std::num::NonZeroU32::new(size.width), std::num::NonZeroU32::new(size.height))
                      else {
                          return;
                      };
                      if surface.resize(w, h).is_err() {
                          return;
                      }
                      let Ok(mut buffer) = surface.buffer_mut() else {
                          return;
                      };
                      let state = STATE.load(Ordering::Relaxed);
                      let total = TOTAL.load(Ordering::Relaxed);
                      let percent = if state == 1 {
                          100
                      } else if total > 0 {
                          (DONE.load(Ordering::Relaxed) * 100 / total) as usize
                      } else {
                          0
                      };
                      let (label, hint) = match state {
                          1 => ("DONE".to_string(), "CLOSE THE APP AND OPEN IT AGAIN"),
                          2 => ("INSTALL FAILED".to_string(), "SEE THE LOGS FOLDER IN FILES"),
                          _ => {
                              let label = LABEL.lock().map(|l| l.clone()).unwrap_or_default();
                              let label = if label.is_empty() { "PREPARING".to_string() } else { label };
                              (label, "KEEP THE APP OPEN AND THE SCREEN ON")
                          }
                      };
                      draw_install_screen(&mut buffer, w.get() as usize, h.get() as usize, &label, percent, hint);
                      let _ = buffer.present();
                  }
              }
              impl winit::application::ApplicationHandler for Keep {
                  fn resumed(&mut self, el: &winit::event_loop::ActiveEventLoop) {
                      if self.window.is_some() {
                          return;
                      }
                      let Ok(window) = el.create_window(winit::window::Window::default_attributes()) else {
                          return;
                      };
                      let window = Rc::new(window);
                      match softbuffer::Context::new(window.clone()) {
                          Ok(context) => {
                              self.surface = softbuffer::Surface::new(&context, window.clone()).ok();
                              self.context = Some(context);
                          }
                          Err(e) => log::error!("Horizon iOS: no progress screen: {e}"),
                      }
                      self.window = Some(window);
                  }
                  fn window_event(
                      &mut self,
                      _: &winit::event_loop::ActiveEventLoop,
                      _: winit::window::WindowId,
                      event: winit::event::WindowEvent,
                  ) {
                      if matches!(event, winit::event::WindowEvent::RedrawRequested) {
                          self.draw();
                      }
                  }
                  fn about_to_wait(&mut self, el: &winit::event_loop::ActiveEventLoop) {
                      el.set_control_flow(winit::event_loop::ControlFlow::WaitUntil(
                          std::time::Instant::now() + std::time::Duration::from_millis(250),
                      ));
                      if let Some(window) = &self.window {
                          window.request_redraw();
                      }
                  }
              }
              match winit::event_loop::EventLoop::new() {
                  Ok(el) => {
                      let _ = el.run_app(&mut Keep { window: None, context: None, surface: None });
                  }
                  Err(e) => log::error!("Horizon iOS: no event loop: {e}"),
              }
              false
          }
          '''
          sub('crates/horizon-client/src/main.rs', [
              ('    raise_open_file_limit();\n',
               '    raise_open_file_limit();\n    #[cfg(target_os = "ios")]\n    if !ios_prepare(&home) {\n        return;\n    }\n', 1),
              ('/// The JVM raises its open-file limit', IOS_FN + '\n/// The JVM raises its open-file limit', 1),
          ])
          # iOS main thread has a 1 MB stack (less under LiveContainer); the game's frames are huge.
          # Run every event callback on a 32 MiB stack of its own (stacker).
          sub('crates/horizon-client/Cargo.toml', [
              ('[dev-dependencies]\n', "[target.'cfg(target_os = \"ios\")'.dependencies]\nstacker = \"0.1\"\nsoftbuffer = \"0.4\"\n\n[dev-dependencies]\n", 1),
          ])
          BIG_STACK = r'''#[cfg(target_os = "ios")]
          struct BigStack<'a, H>(&'a mut H, Option<u64>);
          #[cfg(target_os = "ios")]
          const BIG_STACK: usize = 32 * 1024 * 1024;
          #[cfg(target_os = "ios")]
          impl<H: ApplicationHandler> ApplicationHandler for BigStack<'_, H> {
              fn new_events(&mut self, el: &ActiveEventLoop, cause: winit::event::StartCause) {
                  stacker::grow(BIG_STACK, || self.0.new_events(el, cause))
              }
              fn resumed(&mut self, el: &ActiveEventLoop) {
                  if let Some(m) = el.primary_monitor() {
                      let size = m.size();
                      log::info!("Horizon iOS: monitor {}x{} scale {}", size.width, size.height, m.scale_factor());
                      ios_touch::set_size(size.width.max(size.height) as f32, size.width.min(size.height) as f32);
                  }
                  stacker::grow(BIG_STACK, || self.0.resumed(el))
              }
              fn user_event(&mut self, el: &ActiveEventLoop, event: ()) {
                  stacker::grow(BIG_STACK, || self.0.user_event(el, event))
              }
              fn window_event(&mut self, el: &ActiveEventLoop, id: WindowId, event: WindowEvent) {
                  use winit::event::TouchPhase;
                  if let WindowEvent::Resized(s) = &event {
                      log::info!("Horizon iOS: window resized to {}x{}", s.width, s.height);
                      ios_touch::set_size(s.width as f32, s.height as f32);
                  }
                  if let WindowEvent::ScaleFactorChanged { scale_factor, .. } = &event {
                      log::info!("Horizon iOS: scale factor {scale_factor}");
                  }
                  // iOS only sends touches: the first finger acts as the mouse (menus).
                  let events = match event {
                      WindowEvent::Touch(t)
                          if ios_touch::touch(t.id, t.phase, t.location.x as f32, t.location.y as f32) =>
                      {
                          Vec::new()
                      }
                      WindowEvent::Touch(t) => {
                          let (device_id, position) = (t.device_id, t.location);
                          let moved = WindowEvent::CursorMoved { device_id, position };
                          let button = |state| WindowEvent::MouseInput { device_id, state, button: MouseButton::Left };
                          match t.phase {
                              _ if self.1.is_some_and(|finger| finger != t.id) => Vec::new(),
                              TouchPhase::Started => {
                                  self.1 = Some(t.id);
                                  vec![moved, button(ElementState::Pressed)]
                              }
                              TouchPhase::Moved => vec![moved],
                              TouchPhase::Ended | TouchPhase::Cancelled => {
                                  self.1 = None;
                                  vec![moved, button(ElementState::Released)]
                              }
                          }
                      }
                      other => vec![other],
                  };
                  for event in events {
                      stacker::grow(BIG_STACK, || self.0.window_event(el, id, event))
                  }
              }
              fn device_event(&mut self, el: &ActiveEventLoop, id: DeviceId, event: DeviceEvent) {
                  stacker::grow(BIG_STACK, || self.0.device_event(el, id, event))
              }
              fn about_to_wait(&mut self, el: &ActiveEventLoop) {
                  stacker::grow(BIG_STACK, || self.0.about_to_wait(el))
              }
              fn suspended(&mut self, el: &ActiveEventLoop) {
                  stacker::grow(BIG_STACK, || self.0.suspended(el))
              }
              fn exiting(&mut self, el: &ActiveEventLoop) {
                  stacker::grow(BIG_STACK, || self.0.exiting(el))
              }
              fn memory_warning(&mut self, el: &ActiveEventLoop) {
                  stacker::grow(BIG_STACK, || self.0.memory_warning(el))
              }
          }

          '''
          sub('crates/horizon-client/src/game.rs', [
              ('    let result = new_event_loop()?.run_app(&mut app);\n    narrator::stop();',
               '    #[cfg(target_os = "ios")]\n    let result = new_event_loop()?.run_app(&mut BigStack(&mut app, None));\n    #[cfg(not(target_os = "ios"))]\n    let result = new_event_loop()?.run_app(&mut app);\n    narrator::stop();', 1),
              ('fn new_event_loop() -> std::result::Result', BIG_STACK + 'fn new_event_loop() -> std::result::Result', 1),
          ])
          # Under LiveContainer the window is bigger than the real screen (UIScreen.bounds lies).
          # Never let the window exceed the physical screen (nativeBounds), keeping its orientation.
          sub('third_party/winit/src/platform_impl/ios/window.rs', [
              ('        let screen_bounds = screen.bounds();\n\n        let frame = match window_attributes.inner_size {',
               '''        let screen_bounds = {
                      let reported = screen.bounds();
                      let native = screen.nativeBounds();
                      let native_scale = screen.nativeScale().max(1.0);
                      let long = native.size.width.max(native.size.height) / native_scale;
                      let short = native.size.width.min(native.size.height) / native_scale;
                      let (max_w, max_h) = if reported.size.width >= reported.size.height {
                          (long, short)
                      } else {
                          (short, long)
                      };
                      let width = reported.size.width.min(max_w);
                      let height = reported.size.height.min(max_h);
                      if width != reported.size.width || height != reported.size.height {
                          warn!(
                              "winit iOS: window {}x{} pt does not fit the screen, using {}x{} pt",
                              reported.size.width, reported.size.height, width, height
                          );
                      }
                      CGRect { origin: reported.origin, size: CGSize { width, height } }
                  };

                  // The game asks for 854x480; on a phone that is bigger than the screen: always fill it.
                  let frame = match None::<crate::dpi::Size> {''', 1),
          ])
          # On-screen controls: the fingers are a virtual game pad (the game plays with a pad already).
          IOS_TOUCH = r'''//! iOS: on-screen controls in the style of Minecraft Bedrock. Fingers become a virtual game pad, which
          //! the game already plays with: a round transparent stick that appears under the left thumb (pushed to
          //! its edge it sprints), JUMP and SNEAK on the right, the hotbar and the "..." inventory button at the
          //! bottom, pause / chat / view at the top. The block under the finger is the one that is used: a tap
          //! places or uses, a long press mines or hits, a drag turns the view.
          use horizon_client::gamepad::{Button, PadState};
          use horizon_client::hud::{HudAtlas, HudBatch, rgba};
          use std::sync::Mutex;
          use std::time::{Duration, Instant};
          use winit::event::TouchPhase;

          #[derive(Clone, Copy)]
          enum Icon {
              Up,
              Down,
              Sprint,
              Pause,
              Chat,
              View,
              Dots,
              Back,
          }

          struct Btn {
              icon: Icon,
              /// Centre as a fraction of the width and of the height.
              x: f32,
              y: f32,
              /// Radius as a fraction of the height.
              r: f32,
              button: Button,
              menu: bool,
          }

          const BTNS: [Btn; 7] = [
              Btn { icon: Icon::Up, x: 0.926, y: 0.404, r: 0.065, button: Button::South, menu: false },
              Btn { icon: Icon::Down, x: 0.926, y: 0.595, r: 0.065, button: Button::RightStick, menu: false },
              Btn { icon: Icon::Sprint, x: 0.826, y: 0.50, r: 0.065, button: Button::LeftStick, menu: false },
              Btn { icon: Icon::View, x: 0.467, y: 0.054, r: 0.036, button: Button::DPadUp, menu: false },
              Btn { icon: Icon::Chat, x: 0.499, y: 0.054, r: 0.036, button: Button::DPadRight, menu: false },
              Btn { icon: Icon::Pause, x: 0.532, y: 0.054, r: 0.036, button: Button::Start, menu: false },
              Btn { icon: Icon::Back, x: 0.07, y: 0.11, r: 0.06, button: Button::East, menu: true },
          ];
          /// The "..." button next to the hotbar: its place follows the hotbar's.
          const INV: usize = BTNS.len();

          /// A tap shorter than this and still is a tap; held longer it mines / hits.
          const HOLD: Duration = Duration::from_millis(350);
          /// Pixels a finger may drift and still be a tap.
          const SLOP: f32 = 14.0;

          #[derive(Clone, Copy, PartialEq)]
          enum Role {
              Stick,
              Look,
              Press(usize),
              Ignore,
          }

          struct Finger {
              id: u64,
              role: Role,
              origin: [f32; 2],
              pos: [f32; 2],
              since: Instant,
              travelled: f32,
          }

          struct Pad {
              /// The window in pixels.
              size: [f32; 2],
              /// A menu or a screen is open: the first finger is the mouse, only BACK is drawn.
              menu: bool,
              fingers: Vec<Finger>,
              /// Pixels the right thumb dragged since the view last turned.
              look: [f32; 2],
              /// A tap on the world: "use" is pressed (and the aim stays on the tapped point) until then.
              tap_until: Option<Instant>,
              /// Where that tap was, in pixels.
              tap_at: [f32; 2],
              /// A hotbar slot that was tapped.
              slot: Option<usize>,
              /// The system keyboard is up (a text field of the game has the focus).
              kb: bool,
              /// A finger touched the game above the keyboard: the keyboard (and the chat) is to close.
              dismiss: bool,
              /// A finger touched the game while the keyboard was down: a field tapped again may open it.
              reopen: bool,
          }

          static PAD: Mutex<Pad> = Mutex::new(Pad {
              size: [1792.0, 828.0],
              menu: false,
              fingers: Vec::new(),
              look: [0.0; 2],
              tap_until: None,
              tap_at: [0.0; 2],
              slot: None,
              kb: false,
              dismiss: false,
              reopen: false,
          });

          /// The keyboard was closed by a tap above it while its text field still has the focus.
          static KB_HIDDEN: std::sync::atomic::AtomicBool = std::sync::atomic::AtomicBool::new(false);

          pub fn kb_hidden() -> bool {
              KB_HIDDEN.load(std::sync::atomic::Ordering::Relaxed)
          }

          pub fn set_kb_hidden(hidden: bool) {
              KB_HIDDEN.store(hidden, std::sync::atomic::Ordering::Relaxed);
          }

          fn info(i: usize) -> (Icon, Button, bool) {
              if i == INV {
                  (Icon::Dots, Button::North, false)
              } else {
                  (BTNS[i].icon, BTNS[i].button, BTNS[i].menu)
              }
          }

          /// Centre and radius of a button, in pixels.
          fn layout(i: usize, size: [f32; 2]) -> ([f32; 2], f32) {
              if i == INV {
                  let b = HudBatch::new([size[0] as u32, size[1] as u32]);
                  ([(b.width / 2.0 + 91.0 + 12.0) * b.scale, (b.height - 11.0) * b.scale], 10.5 * b.scale)
              } else {
                  let b = &BTNS[i];
                  ([b.x * size[0], b.y * size[1]], b.r * size[1])
              }
          }

          /// The stick's ring: radius in pixels, and where it rests while no finger holds it.
          fn stick_radius(size: [f32; 2]) -> f32 {
              size[1] * 0.16
          }

          fn stick_rest(size: [f32; 2]) -> [f32; 2] {
              [size[0] * 0.15, size[1] * 0.70]
          }

          /// The window size in pixels (landscape).
          pub fn set_size(w: f32, h: f32) {
              if w > 1.0
                  && h > 1.0
                  && let Ok(mut pad) = PAD.lock()
              {
                  pad.size = [w, h];
              }
          }

          /// Whether a menu is open, as the game says each frame; fingers do not carry over.
          pub fn set_menu(menu: bool) {
              if let Ok(mut pad) = PAD.lock()
                  && pad.menu != menu
              {
                  pad.menu = menu;
                  pad.fingers.clear();
                  pad.look = [0.0; 2];
                  pad.tap_until = None;
              }
          }

          /// The system keyboard is up (or not), as the game says each frame.
          pub fn set_kb(kb: bool) {
              if let Ok(mut pad) = PAD.lock() {
                  pad.kb = kb;
                  if !kb {
                      pad.dismiss = false;
                  }
              }
          }

          /// A tap above the keyboard while it is up, since the last call.
          pub fn take_dismiss() -> bool {
              PAD.lock().map(|mut p| std::mem::take(&mut p.dismiss)).unwrap_or(false)
          }

          /// A tap on the game while the keyboard was down, since the last call.
          pub fn take_reopen() -> bool {
              PAD.lock().map(|mut p| std::mem::take(&mut p.reopen)).unwrap_or(false)
          }

          /// A hotbar slot tapped since the last call.
          pub fn take_slot() -> Option<usize> {
              PAD.lock().ok().and_then(|mut p| p.slot.take())
          }

          /// The point of the screen the player acts on (a fraction of the width and of the height): the finger
          /// that presses the world, or the place of a tap that has just let go. `None`: the view's centre.
          pub fn aim() -> Option<[f32; 2]> {
              let pad = PAD.lock().ok()?;
              if pad.menu {
                  return None;
              }
              let at = if let Some(f) = pad.fingers.iter().find(|f| f.role == Role::Look && f.travelled < SLOP) {
                  f.pos
              } else if pad.tap_until.is_some_and(|t| Instant::now() < t) {
                  pad.tap_at
              } else {
                  return None;
              };
              Some([at[0] / pad.size[0].max(1.0), at[1] / pad.size[1].max(1.0)])
          }

          /// A touch. True when an on-screen control owns the finger (it is not a mouse click then).
          pub fn touch(id: u64, phase: TouchPhase, x: f32, y: f32) -> bool {
              let Ok(mut pad) = PAD.lock() else {
                  return false;
              };
              let size = pad.size;
              let now = Instant::now();
              match phase {
                  TouchPhase::Started => {
                      let menu = pad.menu;
                      let finger = |role| Finger { id, role, origin: [x, y], pos: [x, y], since: now, travelled: 0.0 };
                      for i in 0..=INV {
                          if info(i).2 != menu {
                              continue;
                          }
                          let (c, r) = layout(i, size);
                          let reach = r * 1.5;
                          if (x - c[0]).powi(2) + (y - c[1]).powi(2) <= reach * reach {
                              pad.fingers.push(finger(Role::Press(i)));
                              return true;
                          }
                      }
                      if menu {
                          // The system keyboard and its text field take their own touches: this one is above them.
                          // The touch still goes on to the screen as a click.
                          if pad.kb {
                              pad.dismiss = true;
                          } else {
                              pad.reopen = true;
                          }
                          return false;
                      }
                      let b = HudBatch::new([size[0] as u32, size[1] as u32]);
                      if let Some(slot) = horizon_client::touch::hotbar_slot(b.width, b.height, [x / b.scale, y / b.scale]) {
                          pad.slot = Some(slot);
                          pad.fingers.push(finger(Role::Ignore));
                          return true;
                      }
                      let role = if x < size[0] * 0.45 { Role::Stick } else { Role::Look };
                      pad.fingers.push(finger(role));
                      true
                  }
                  TouchPhase::Moved => {
                      let Some(f) = pad.fingers.iter().position(|f| f.id == id) else {
                          return false;
                      };
                      let (dx, dy) = (x - pad.fingers[f].pos[0], y - pad.fingers[f].pos[1]);
                      pad.fingers[f].pos = [x, y];
                      if pad.fingers[f].role == Role::Look {
                          pad.fingers[f].travelled += (dx * dx + dy * dy).sqrt();
                          if pad.fingers[f].travelled > 6.0 {
                              pad.look[0] += dx;
                              pad.look[1] += dy;
                          }
                      }
                      true
                  }
                  TouchPhase::Ended | TouchPhase::Cancelled => {
                      let Some(f) = pad.fingers.iter().position(|f| f.id == id) else {
                          return false;
                      };
                      let finger = pad.fingers.remove(f);
                      if finger.role == Role::Look && finger.travelled < SLOP && finger.since.elapsed() < HOLD {
                          pad.tap_until = Some(now + Duration::from_millis(80));
                          pad.tap_at = finger.pos;
                      }
                      true
                  }
              }
          }

          /// The virtual pad for this frame.
          pub fn state() -> PadState {
              let mut s = PadState::default();
              let Ok(pad) = PAD.lock() else {
                  return s;
              };
              let radius = stick_radius(pad.size);
              for f in &pad.fingers {
                  match f.role {
                      Role::Stick => {
                          let (dx, dy) = ((f.pos[0] - f.origin[0]) / radius, (f.pos[1] - f.origin[1]) / radius);
                          let len = (dx * dx + dy * dy).sqrt();
                          let k = if len > 1.0 { 1.0 / len } else { 1.0 };
                          s.left = [dx * k, -dy * k];
                          // Pushed to the edge and beyond: sprint.
                          if len > 1.25 {
                              s.set(Button::LeftStick, true);
                          }
                      }
                      // A long press without moving: mine / hit.
                      Role::Look => {
                          if f.travelled < SLOP && f.since.elapsed() >= HOLD {
                              s.triggers[1] = 1.0;
                          }
                      }
                      Role::Ignore => {}
                      Role::Press(i) => s.set(info(i).1, true),
                  }
              }
              if pad.tap_until.is_some_and(|t| Instant::now() < t) {
                  s.triggers[0] = 1.0;
              }
              s
          }

          /// The pixels the view is to turn by since the last call.
          pub fn take_look() -> [f32; 2] {
              PAD.lock().map(|mut p| std::mem::take(&mut p.look)).unwrap_or([0.0; 2])
          }

          /// A filled circle, as horizontal strips.
          fn disc(b: &mut HudBatch, a: &HudAtlas, cx: f32, cy: f32, r: f32, color: u32) {
              let strips = ((r / 2.0) as i32).clamp(5, 48);
              let h = 2.0 * r / strips as f32;
              for s in 0..strips {
                  let y = -r + (s as f32 + 0.5) * h;
                  let half = (r * r - y * y).max(0.0).sqrt();
                  b.fill(a, cx - half, cy + y - h / 2.0, half * 2.0, h + 0.5, color);
              }
          }

          /// A thick line, as a run of small squares.
          fn stroke(b: &mut HudBatch, a: &HudAtlas, from: [f32; 2], to: [f32; 2], w: f32, color: u32) {
              let len = ((to[0] - from[0]).powi(2) + (to[1] - from[1]).powi(2)).sqrt();
              let n = ((len / (w * 0.5)).ceil() as i32).max(1);
              for i in 0..=n {
                  let t = i as f32 / n as f32;
                  let (x, y) = (from[0] + (to[0] - from[0]) * t, from[1] + (to[1] - from[1]) * t);
                  b.fill(a, x - w / 2.0, y - w / 2.0, w, w, color);
              }
          }

          /// A pixel-style arrow with a bar: up (`s` = 1) or down (`s` = -1).
          fn arrow(b: &mut HudBatch, a: &HudAtlas, cx: f32, cy: f32, u: f32, s: f32, ink: u32) {
              let p = u / 5.0;
              let mut rect = |x: f32, dy: f32, w: f32, dh: f32| {
                  let y = if s > 0.0 { cy + dy } else { cy - dy - dh };
                  b.fill(a, x, y, w, dh, ink);
              };
              for i in 0..5 {
                  let half = (i as f32 + 0.5) * p;
                  rect(cx - half, -u * 0.9 + i as f32 * p, half * 2.0, p + 0.4);
              }
              rect(cx - u * 0.28, -u * 0.9 + 5.0 * p, u * 0.56, u * 0.6);
              rect(cx - u, u * 0.8, u * 2.0, (p * 0.7).max(1.0));
          }

          /// A dark pictogram in a button whose half-size is `r`.
          fn icon(b: &mut HudBatch, a: &HudAtlas, icon: Icon, cx: f32, cy: f32, r: f32) {
              let ink = rgba(48, 48, 48, 255);
              let light = rgba(236, 236, 236, 255);
              let u = r * 0.52;
              let w = (r * 0.16).max(1.5);
              match icon {
                  Icon::Up => arrow(b, a, cx, cy, u, 1.0, ink),
                  Icon::Down => arrow(b, a, cx, cy, u, -1.0, ink),
                  Icon::Sprint => {
                      for dx in [-0.55, 0.35] {
                          stroke(b, a, [cx + u * dx, cy - u * 0.8], [cx + u * (dx + 0.6), cy], w * 1.4, ink);
                          stroke(b, a, [cx + u * (dx + 0.6), cy], [cx + u * dx, cy + u * 0.8], w * 1.4, ink);
                      }
                  }
                  Icon::Back => {
                      stroke(b, a, [cx + u * 0.4, cy - u], [cx - u * 0.6, cy], w * 1.4, ink);
                      stroke(b, a, [cx - u * 0.6, cy], [cx + u * 0.4, cy + u], w * 1.4, ink);
                  }
                  Icon::Pause => {
                      for dy in [-0.7, -0.1, 0.5] {
                          b.fill(a, cx - u * 0.9, cy + u * dy, u * 1.8, u * 0.4, ink);
                      }
                  }
                  Icon::Chat => {
                      let (l, t, rr, bt) = (cx - u, cy - u * 0.8, cx + u, cy + u * 0.5);
                      stroke(b, a, [l, t], [rr, t], w, ink);
                      stroke(b, a, [l, bt], [rr, bt], w, ink);
                      stroke(b, a, [l, t], [l, bt], w, ink);
                      stroke(b, a, [rr, t], [rr, bt], w, ink);
                      stroke(b, a, [cx - u * 0.5, bt], [cx - u * 0.7, cy + u], w, ink);
                      for dx in [-0.5, 0.0, 0.5] {
                          b.fill(a, cx + u * dx - w / 2.0, cy - u * 0.15, w, w, ink);
                      }
                  }
                  Icon::View => {
                      // A head and shoulders.
                      b.fill(a, cx - u * 0.35, cy - u * 0.95, u * 0.7, u * 0.7, ink);
                      b.fill(a, cx - u * 0.8, cy - u * 0.1, u * 1.6, u * 0.45, ink);
                      b.fill(a, cx - u * 0.55, cy + u * 0.35, u * 1.1, u * 0.55, ink);
                  }
                  Icon::Dots => {
                      for dx in [-0.8, 0.0, 0.8] {
                          b.fill(a, cx + u * dx - w * 0.6, cy - w * 0.6, w * 1.2, w * 1.2, light);
                      }
                  }
              }
          }

          /// A square button like Bedrock's: dark outline, a light top-left edge, a shadowed bottom-right edge.
          fn round_button(b: &mut HudBatch, a: &HudAtlas, cx: f32, cy: f32, r: f32, down: bool) {
              let t = (r / 13.0).max(0.6);
              let (x, y, s) = (cx - r, cy - r, r * 2.0);
              let (body, light, shade) = if down {
                  (rgba(92, 92, 92, 255), rgba(130, 130, 130, 255), rgba(150, 150, 150, 255))
              } else {
                  (rgba(118, 118, 118, 255), rgba(168, 168, 168, 255), rgba(78, 78, 78, 255))
              };
              b.fill(a, x, y, s, s, rgba(28, 28, 28, 255));
              b.fill(a, x + t, y + t, s - 2.0 * t, s - 2.0 * t, shade);
              b.fill(a, x + t, y + t, s - 3.0 * t, s - 3.0 * t, light);
              b.fill(a, x + 2.0 * t, y + 2.0 * t, s - 4.0 * t, s - 4.0 * t, body);
          }

          /// The controls, over the game. Touches and the layout are in window pixels; the HUD draws in GUI units.
          pub fn draw(b: &mut HudBatch, a: &HudAtlas) {
              let Ok(pad) = PAD.lock() else {
                  return;
              };
              let size = pad.size;
              let sc = b.scale.max(1.0);
              let ring = stick_radius(size) / sc;
              if !pad.menu {
                  // The stick: where the left thumb is, or a faint ring where it would start.
                  let held = pad.fingers.iter().find(|f| f.role == Role::Stick);
                  let (origin, pos, strength) = match held {
                      Some(f) => (f.origin, f.pos, 1.0),
                      None => (stick_rest(size), stick_rest(size), 0.45),
                  };
                  let o = [origin[0] / sc, origin[1] / sc];
                  let (dx, dy) = ((pos[0] - origin[0]) / sc, (pos[1] - origin[1]) / sc);
                  let len = (dx * dx + dy * dy).sqrt();
                  let k = if len > ring { ring / len } else { 1.0 };
                  let alpha = |v: f32| (v * strength) as u8;
                  disc(b, a, o[0], o[1], ring, rgba(255, 255, 255, alpha(70.0)));
                  disc(b, a, o[0], o[1], ring - 2.0, rgba(0, 0, 0, alpha(70.0)));
                  disc(b, a, o[0] + dx * k, o[1] + dy * k, ring * 0.4, rgba(255, 255, 255, alpha(150.0)));
              }
              for i in 0..=INV {
                  let (which, _, menu) = info(i);
                  if menu != pad.menu {
                      continue;
                  }
                  let (c, r) = layout(i, size);
                  let (c, r) = ([c[0] / sc, c[1] / sc], r / sc);
                  let down = pad.fingers.iter().any(|f| f.role == Role::Press(i));
                  round_button(b, a, c[0], c[1], r, down);
                  icon(b, a, which, c[0], c[1], r);
              }
          }

          impl super::Game<'_> {
              /// The virtual pad of the fingers; the game polls it like a controller.
              pub(super) fn ios_pad_state(&mut self) -> PadState {
                  let menu = self.pad_in_menu();
                  set_menu(menu);
                  set_kb(self.ime_allowed);
                  if take_reopen() {
                      set_kb_hidden(false);
                  }
                  if take_dismiss() {
                      if self.screen == super::Screen::Chat {
                          self.chat_key_code(winit::keyboard::KeyCode::Escape, None);
                      } else {
                          // A text field of a menu: only the keyboard goes away.
                          set_kb_hidden(true);
                      }
                  }
                  if let Some(slot) = take_slot()
                      && !menu
                      && !self.spectator()
                  {
                      self.selected = slot;
                  }
                  state()
              }
          }
          '''
          open('crates/horizon-client/src/game/ios_touch.rs', 'w').write(IOS_TOUCH)
          sub('crates/horizon-client/src/game.rs', [
              ('mod android_bundled;\n', 'mod android_bundled;\n#[cfg(target_os = "ios")]\nmod ios_touch;\n', 1),
