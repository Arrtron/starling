          # A real text field above the system keyboard, with the usual paste / copy menu.
          NATIVE_FIELD = r'''    pub fn set_ime_allowed(&self, allowed: bool) {
                  use std::cell::RefCell;
                  use std::rc::Rc;

                  use block2::RcBlock;
                  use objc2_foundation::NSString;

                  // A real text field above the keyboard (made once): the system's own editing, with the paste / copy
